name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # `npm ci` requires a committed package-lock.json, which this
        # repository does not track.
        run: npm install

      - name: Typecheck
        run: npm run typecheck